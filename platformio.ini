[env:esp32dev]
platform = espressif32@5.2.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
    ;mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.5
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
    ottowinter/ESPAsyncWebServer-esphome @ ^3.3.1
    me-no-dev/AsyncTCP @ ^1.1.1
    https://github.com/gmag11/ESPNtpClient.git
    links2004/WebSockets @ ^2.6.1
    bodmer/JPEGDecoder @ ^1.0.0

build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DMATRIX_WIDTH=128
    -DMATRIX_HEIGHT=64
;upload_protocol = espota
;upload_port = Keg-Matrix2.local
;upload_flags =
;    --auth=slick1963